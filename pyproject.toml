[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasticity3d-jax"
version = "0.1.0"
description = "Functional JAX finite elements for small-strain 3D J2 plasticity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jax>=0.4.20",
  "matplotlib>=3.7",
  "meshio>=5.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plasticity3d_jax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
